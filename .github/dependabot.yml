# Opens pull requests when the GitHub Actions, the base images of docker/Dockerfile.*
# and the npm or Composer packages publish new versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # PHP moves by hand (composer.json platform and the CI matrix must follow)
      - dependency-name: php
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # Node majors move by hand (.nvmrc, package.json engines and the CI must follow)
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
