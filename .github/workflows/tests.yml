# ----------------------------------------------------------------------------
# Tests Workflow
# Backend (Pint + PHPUnit) and front end (lint, format check, Vite build) on
# every push to main and on every pull request.
# ----------------------------------------------------------------------------

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Pint + PHPUnit)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, exif, mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/phpunit

      # The scheduled commands load and keep their times (routes/console.php); the overlap locks live in the cache
      - name: List the schedule
        run: php artisan schedule:list
        env:
          CACHE_STORE: array

  frontend:
    name: Front end (lint + build)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Node version from .nvmrc (26) and an npm cache keyed by package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Clean install; fails if package.json and the lockfile are out of sync
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build assets
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: public-build
          path: public/build
          retention-days: 7
          if-no-files-found: error
