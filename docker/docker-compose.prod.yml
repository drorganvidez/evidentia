services:
  app:
    image: drorganvidez/evidentia:latest
    container_name: evidentia_app_container
    restart: unless-stopped
    volumes:
      - ../.env:/var/www/html/.env
      - ../storage:/var/www/html/storage
      - ../scripts:/var/www/html/scripts
      # Compiled assets, shared with nginx. The entrypoint refreshes it from the image on every start.
      - public_build:/var/www/html/public/build
    expose:
      - '9000'
    depends_on:
      - mysql
      - redis
    env_file:
      - ../.env
    networks:
      - evidentia_net

  # Runs the scheduled commands (routes/console.php) every minute with the same image. It skips the entrypoint of
  # app: the migrations, the caches and the copy of the assets are done there only. wait-for-db.sh ends in exec "$@".
  scheduler:
    image: drorganvidez/evidentia:latest
    container_name: evidentia_scheduler_container
    restart: unless-stopped
    entrypoint: ['sh', 'scripts/wait-for-db.sh', 'php', 'artisan', 'schedule:work']
    volumes:
      - ../.env:/var/www/html/.env
      - ../storage:/var/www/html/storage
      - ../scripts:/var/www/html/scripts
    depends_on:
      - app
      - mysql
      - redis
    env_file:
      - ../.env
    networks:
      - evidentia_net

  mysql:
    image: mysql:8
    container_name: evidentia_mysql_container
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - '${DB_FORWARD_PORT:-3307}:3306'
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - evidentia_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8080:80
    environment:
      PMA_ARBITRARY: 0
      PMA_HOST: evidentia_mysql_container
      PMA_ABSOLUTE_URI: https://vm.diverso-lab.us.es/phpmyadmin/evidentia
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    depends_on:
      - mysql
    networks:
      - evidentia_net
    restart: always

  redis:
    image: redis:8
    container_name: evidentia_redis_container
    restart: unless-stopped
    networks:
      - evidentia_net

  nginx:
    image: nginx:alpine
    container_name: evidentia_nginx_container
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - app
    volumes:
      - ../:/var/www/html
      - public_build:/var/www/html/public/build:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - evidentia_net

  watchtower:
    container_name: evidentia_watchtower_container
    image: containrrr/watchtower
    environment:
      # Docker 29+ rechaza la API 1.25 que usa watchtower por defecto
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 120 evidentia_app_container evidentia_scheduler_container
    restart: unless-stopped
    networks:
      - evidentia_net

volumes:
  db_data_prod:
  public_build:

networks:
  evidentia_net:
