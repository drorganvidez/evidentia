server {
    listen 80;
    server_name localhost;

    # Tamaño máximo permitido (archivo + FormData + cabeceras)
    client_max_body_size 2G;

    root /var/www/html/public;
    index index.php index.html;

    # DNS interno de Docker: cuando Watchtower recrea app, su dirección cambia y nginx la vuelve a buscar en lugar de
    # seguir enviando PHP a la dirección antigua (que puede ser ya la del planificador) y responder 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Entrada principal
    location / {
        client_max_body_size 2G;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compilados por Vite: nombres con hash, cacheables un año
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El fichero del servidor de desarrollo de Vite nunca se sirve
    location = /hot {
        return 404;
    }

    # Ejecución de PHP
    location ~ \.php$ {
        include fastcgi_params;
        # con una variable nginx resuelve app en cada petición a través del resolver
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;

        # Timeouts razonables para subidas grandes
        fastcgi_connect_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    # Seguridad mínima
    location ~ /\.ht {
        deny all;
    }
}
